kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: vector-http-receiver-configmap-template
objects:
- apiVersion: v1
  kind: ConfigMap
  metadata:
    name: ${NAME}
    namespace: ${NAMESPACE}
    labels:
      provider: aosqe
      component: ${NAME}
  data:
    vector.toml: |
      data_dir = "/tmp/vector-data"

      [sources.my_source]
      type = "http_server"
      address = "0.0.0.0:8090"
      decoding.codec = "json"
      framing.method = "newline_delimited"

      [transforms.route_logs]
      type = "route"
      inputs = ["my_source"]
      route.audit = '.log_type == "audit"'
      route.container = 'exists(.kubernetes)'
      route.journal = '!exists(.kubernetes)'

      [sinks.container]
      inputs = ["route_logs.container"]
      type = "file"
      path = "/tmp/container/{{kubernetes.namespace_name}}_{{kubernetes.pod_name}}_{{kubernetes.container_name}}.json"

      [sinks.container.encoding]
      codec = "json"

      [sinks.out_journal]
      inputs = ["route_logs.journal"]
      type = "file"
      path = "/tmp/journal/journal.json"

      [sinks.out_journal.encoding]
      codec = "json"

      [sinks.out_audit]
      inputs = ["route_logs.audit"]
      type = "file"
      path = "/tmp/audit/audit.json"

      [sinks.out_audit.encoding]
      codec = "json"
parameters:
- name: NAME
  value: vector-http-receiver
- name: NAMESPACE
  value: openshift-logging
