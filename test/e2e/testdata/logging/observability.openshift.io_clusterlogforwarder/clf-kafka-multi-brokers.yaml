kind: Template
apiVersion: template.openshift.io/v1
metadata:
  name: forward-to-kafka-template
objects:
- apiVersion: observability.openshift.io/v1
  kind: ClusterLogForwarder
  metadata:
    name: ${NAME}
    namespace: ${NAMESPACE}
  spec:
    collector: ${{COLLECTOR}}
    managementState: Managed
    inputs:
    - name: selected-app
      application:
        includes:
          - namespace: ${NAMESPACE_PATTERN}
      type: application
    outputs:
    - kafka:
        brokers: ${{BROKERS1}}
        topic: ${TOPIC}
        tuning: ${{TUNING}}
      name: kafka-broker1
      type: kafka
    - kafka:
        brokers: ${{BROKERS2}}
        topic: ${TOPIC}
        tuning: ${{TUNING}}
      name: kafka-broker2
      type: kafka
    pipelines:
    - inputRefs:
      - selected-app
      - audit
      name: pipe1
      outputRefs:
      - kafka-broker1
      - kafka-broker2
    serviceAccount:
      name: ${SERVICE_ACCOUNT_NAME}
parameters:
- name: NAME
  value: "instance"
- name: BROKERS1
  value: "[\"tls://my-cluster-kafka-bootstrap.amq-aosqe1.svc:9092\", \"tls://my-cluster-kafka-0.my-cluster-kafka-brokers.amq-aosqe1.svc:9092\"]"
- name: BROKERS2
  value: "[\"tls://my-cluster-kafka-bootstrap.amq-aosqe2.svc:9092\", \"tls://my-cluster-kafka-0.my-cluster-kafka-brokers.amq-aosqe2.svc:9092\"]"
- name: TOPIC
  value: "{.log_type||\"none-typed-logs\"}"
- name: SERVICE_ACCOUNT_NAME
  value: ""
- name: TUNING
  value: "{}"
- name: NAMESPACE_PATTERN
  value: "e2e*"
- name: NAMESPACE
  value: "openshift-logging"
- name: COLLECTOR
  value: "{}"
